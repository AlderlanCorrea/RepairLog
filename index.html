<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairLog - Assistência Técnica</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div id="logo-container">
            <img src="./img/Gemini_Generated_Image_166guy166guy166g-removebg-preview.png" id="logo" alt="RepairLog Logo">
            <div>
                <input type="search" name="situacaoServico" id="situacao" placeholder="Pesquise seu Serviço...">
                <button type="button">Pesquisar</button>
            </div>
        </div>
        <h1>Bem-vindo ao RepairLog!</h1>
        <p>Onde você pode registrar e acompanhar os serviços do seu aparelho.</p>
    </header>
    <main>
        <div id="servicos-registrados">
            <ul id="lista-servicos">
                <li>Serviço 1: <br> Nome do Cliente <br> Aparelho <br> Problema <br> situação</li>
            </ul>
        </div>
        <form action="" method="post">
            <h2>Registro de Serviço</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required><br><br>

            <label for="aparelho">Aparelho:</label>
            <input type="text" id="aparelho" name="aparelho" required><br><br>

            <label for="problema">Problema:</label>
            <textarea id="problema" name="problema" required></textarea><br><br>

            <button>Regirtar Serviço</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 RepairLog. Todos os direitos reservados.</p>
    </footer>
</body>
<script src="js/script.js"></script>
</html>
