<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairLog - Assistência Técnica</title>
</head>
<body>
    <header>
        <h1>RepairLog - Assistência Técnica</h1>
        <p>Bem-vindo ao RepairLog!</p>
        <p>Onde você pode registrar e acompanhar os serviços do seu aparelho.</p>
    </header>
    <main>
        <form action="" method="post">
            <h2>Registro de Serviço</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required><br><br>

            <label for="aparelho">Aparelho:</label>
            <input type="text" id="aparelho" name="aparelho" required><br><br>

            <label for="problema">Problema:</label>
            <textarea id="problema" name="problema" required></textarea><br><br>

            <input type="submit" value="Registrar Serviço">
        </form>
    </main>
</body>
</html>
